# Sentinels — stack for Portainer with Docker SWARM
# (use this one if Portainer complains "unsupported options: mem_limit…").
#
# Stacks → Add stack → Web editor → paste → Deploy the stack. Then:
#   1. Containers → sentinels_sentinels.<…> → Console
#      Command: Custom → /usr/local/bin/sentinels setup -config /var/lib/sentinels/sentinels.yaml
#      (User empty) → Connect → configure → "Save and exit"
#   2. Services → sentinels_sentinels → Update the service (or Restart the container)
#
# Both services run in global mode: one agent and one proxy on each node of the cluster.
# Both use the host network; the proxy listens ONLY on 127.0.0.1:2375 (no port is
# published — on Swarm, "ports" would expose the proxy on every interface).
version: "3.8"

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      BIND_CONFIG: 127.0.0.1:2375   # localhost only
      CONTAINERS: 1
      IMAGES: 1
      SERVICES: 1     # reading the Swarm services (Traefik domains)
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [hostnet]
    labels:
      io.sentinels.self: "true"
    deploy:
      mode: global
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 64M

  sentinels:
    image: ghcr.io/santanacharles/sentinels:latest   # to pin a version: :v0.2.4
    command: ["watch", "-config", "/var/lib/sentinels/sentinels.yaml"]
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
    networks: [hostnet]
    volumes:
      - sentinels-data:/var/lib/sentinels
      - type: tmpfs
        target: /tmp
      # host /proc (read-only): who connects to each database
      - /proc:/host/proc:ro
      # Optional, if Suricata is installed on the host:
      # - /var/log/suricata:/var/log/suricata:ro
    read_only: true
    cap_drop: [ALL]
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M

networks:
  hostnet:
    external: true
    name: host

volumes:
  sentinels-data:
