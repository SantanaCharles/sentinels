# Configuration for docker-compose (copy to sentinels.yaml).
# Full reference: sentinels.example.yaml in the project root.

# docker.socket comes from DOCKER_HOST (tcp://127.0.0.1:2375, the read-only proxy).

scan:
  interval: 6h
  report_dir: /var/lib/sentinels/reports
  cache_dir: /var/lib/sentinels/cache
  # urls: [https://mysite.com]

storage:
  path: /var/lib/sentinels/sentinels.db

integrations:
  trivy:    { enabled: auto }
  crowdsec: { enabled: auto, url: http://127.0.0.1:8080, api_key_env: SENTINELS_CROWDSEC_KEY }
  suricata: { enabled: auto, eve_log: /var/log/suricata/eve.json }
  falco:    { enabled: auto, listen: 127.0.0.1:2801 }
  # Inside applications and databases (docs/APPLICATIONS.md): Postgres and app logs
  # via the Docker API, plus who connects to each database. Turn parts off with logs/db_clients: false.
  containers: { enabled: auto }

alerts:
  min_severity: high
  notifiers:
    # - type: telegram
    #   token_env: SENTINELS_TELEGRAM_TOKEN
    #   chat_id: "-1001234567890"

ai:
  enabled: false
  provider: anthropic
  model: claude-sonnet-5-5
  api_key_env: SENTINELS_AI_KEY

vault:
  enabled: false
  path: /var/lib/sentinels/vault
