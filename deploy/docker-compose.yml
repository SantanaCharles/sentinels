# Sentinels with Docker Compose.
#
#   cp sentinels.docker.yaml sentinels.yaml     # adjust
#   cp sentinels.env.example sentinels.env      # keys and tokens; chmod 600 sentinels.env
#   docker compose up -d
#   docker compose exec sentinels sentinels doctor
#
# The agent does NOT get the Docker socket: it talks to a proxy that only allows
# reading containers and images (POST/DELETE blocked). Even if the agent were
# compromised, it could not create containers or control the host.
name: sentinels

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # GET /containers/json, /containers/{id}/json and /logs
      IMAGES: 1       # Trivy reads the local images
      SERVICES: 1     # reading the Swarm services (Traefik domains)
      POST: 0         # no writes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"   # localhost only
    labels:
      io.sentinels.self: "true"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m

  sentinels:
    image: ghcr.io/santanacharles/sentinels:latest
    build: ..                    # no published image? `docker compose build`
    restart: unless-stopped
    depends_on: [socket-proxy]
    # Host network: the agent tests the ports published on 127.0.0.1, sees the
    # services listening on the host and receives Falco on 127.0.0.1:2801.
    network_mode: host
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
    env_file: [./sentinels.env]
    volumes:
      - ./sentinels.yaml:/etc/sentinels/sentinels.yaml:ro
      - sentinels-data:/var/lib/sentinels
      # host /proc (read-only): who connects to each database
      - /proc:/host/proc:ro
      # Optional: Suricata alerts
      # - /var/log/suricata:/var/log/suricata:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200

volumes:
  sentinels-data:
