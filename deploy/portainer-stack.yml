# Sentinels — stack for Portainer (Stacks → Add stack → Web editor → paste this file).
#
# After "Deploy the stack":
#   1. Containers → sentinels-sentinels-1 → Console
#      Command: Custom → /usr/local/bin/sentinels setup -config /var/lib/sentinels/sentinels.yaml
#      (leave "User" empty) → Connect → configure with the arrow keys → "Save and exit"
#   2. Restart the sentinels-sentinels-1 container (Restart button)
#   3. Container logs: the first report comes out in ~1 minute (a bit more with Trivy)
#
# Configuration and secrets live in the "sentinels-data" volume (sentinels.yaml and sentinels.env 0600):
# nothing to create on the host. The agent does not get the Docker socket: it uses the read-only proxy.
services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      SERVICES: 1     # reading the Swarm services (Traefik domains)
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    labels:
      io.sentinels.self: "true"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m

  sentinels:
    image: ghcr.io/santanacharles/sentinels:latest   # to pin a version: :v0.2.4
    restart: unless-stopped
    depends_on: [socket-proxy]
    network_mode: host
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
    command: ["watch", "-config", "/var/lib/sentinels/sentinels.yaml"]
    volumes:
      - sentinels-data:/var/lib/sentinels
      # host /proc (read-only): who connects to each database
      - /proc:/host/proc:ro
      # Optional: scan the host OS packages for CVEs (set scan.host_root: /host/root)
      # - /:/host/root:ro
      # Optional, if Suricata is installed on the host:
      # - /var/log/suricata:/var/log/suricata:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200

volumes:
  sentinels-data:
