name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Feed de alertas assinado
        run: go run ./cmd/feedsign verify internal/intel/advisories.json
      - name: shellcheck
        # Versão fixa: a do runner muda com a imagem do Ubuntu.
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -s sh deploy/install.sh scripts/release.sh
      - name: Imagem Docker compila
        run: docker build -t sentinels:ci .
